name: Discover TCG pack opportunities

on:
  push:
    paths:
      - 'scripts/discover_opportunities.py'
      - '.github/workflows/discover-opportunities.yml'
  schedule:
    - cron: "23 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opportunity-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run public announcement discovery
        run: python3 scripts/discover_opportunities.py
      - name: Publish new discovery data
        run: |
          if git diff --quiet -- data/discoveries.json; then
            echo "No discovery changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discoveries.json
          git commit -m "Refresh automatically discovered TCG opportunities"
          git push
